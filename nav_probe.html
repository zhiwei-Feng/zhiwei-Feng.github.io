<!doctype html><meta charset="utf-8">
<body style="margin:0;font:11px/1.4 monospace;background:#fff;color:#000;padding:4px;white-space:pre-wrap">
<iframe id="f" src="/" style="width:375px;height:200px;border:0"></iframe>
<pre id="o">loading...</pre>
<script>
document.getElementById('f').addEventListener('load',()=>setTimeout(()=>{
  try{
    const w=document.getElementById('f').contentWindow, d=w.document;
    const out=['iframe w='+w.innerWidth];
    for(const q of ['(max-width:767px)']){out.push('mq '+q+'='+w.matchMedia(q).matches);}
    for(const s of ['.site-nav','.site-nav__title','.site-nav__links','.site-nav__tools','.site-nav__search','.theme-toggle','.site-nav__hamburger']){
      const e=d.querySelector(s);if(!e){out.push(s+' MISS');continue}
      const r=e.getBoundingClientRect(),cs=w.getComputedStyle(e);
      out.push(s+' ('+Math.round(r.x)+','+Math.round(r.y)+') '+Math.round(r.width)+'x'+Math.round(r.height)+' '+cs.display+' '+cs.position+' col='+cs.color);
    }
    const n=d.querySelector('.site-nav');
    if(n){out.push('nav gtc='+w.getComputedStyle(n).gridTemplateColumns);out.push('nav kids='+n.children.length);
      [...n.children].forEach((c,i)=>out.push(' ['+i+'] '+c.className+' '+w.getComputedStyle(c).display));}
    document.getElementById('o').textContent=out.join('\n');
  }catch(err){document.getElementById('o').textContent='ERR '+err.message;}
},1500));
</script>
